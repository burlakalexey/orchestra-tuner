<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta id="themeColorMeta" name="theme-color" content="#e5e5ea" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Тюнер" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="apple-touch-icon" href="./icon-192.png" />
  <link rel="icon" type="image/png" href="./icon-192.png" />
  <title>Оркестровый тюнер</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main id="stage" class="stage state-idle">
    <!-- Симметрично колеблющаяся SVG-дуга фона -->
    <svg id="bgCurveSvg" class="bg-curve-svg" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
      <path id="bgCurvePath" d="M 50 0 Q 50 50 50 100 L 100 100 L 100 0 Z" />
    </svg>

    <!-- Стартовый экран -->
    <button id="startOverlay" class="start-overlay" type="button">
      <span class="start-mic-circle">
        <svg viewBox="0 0 24 24" class="mic-icon" aria-hidden="true">
          <rect x="9" y="2.5" width="6" height="11" rx="3" fill="currentColor"/>
          <path d="M5.5 11a6.5 6.5 0 0 0 13 0" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
          <line x1="12" y1="17.5" x2="12" y2="21.5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
          <line x1="8.5" y1="21.5" x2="15.5" y2="21.5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
        </svg>
      </span>
      <span class="start-label">Нажмите, чтобы включить микрофон</span>
    </button>

    <!-- Верхняя строка -->
    <button id="topMetaBtn" class="top-meta" type="button">
      <span id="topMetaLabel">442 Hz</span>
    </button>

    <!-- Центральная зона тюнера -->
    <section class="tuner-core" aria-live="polite">
      <div class="note-display">
        <span id="noteName" class="note-letter">—</span>
        <span class="note-modifiers">
          <span id="noteAccidental" class="note-accidental"></span>
          <span id="noteOctave" class="note-octave"></span>
        </span>
      </div>

      <!-- Шкала жёстко в HTML — 21 точка от -50 до +50 -->
      <div class="scale-wrap" aria-hidden="true">
        <div id="dotTrack" class="dot-track">
          <span class="scale-dot major" style="left: 0%"></span>
          <span class="scale-dot" style="left: 5%"></span>
          <span class="scale-dot" style="left: 10%"></span>
          <span class="scale-dot" style="left: 15%"></span>
          <span class="scale-dot" style="left: 20%"></span>
          <span class="scale-dot major" style="left: 25%"></span>
          <span class="scale-dot" style="left: 30%"></span>
          <span class="scale-dot" style="left: 35%"></span>
          <span class="scale-dot" style="left: 40%"></span>
          <span class="scale-dot" style="left: 45%"></span>
          <span class="scale-dot center" style="left: 50%"></span>
          <span class="scale-dot" style="left: 55%"></span>
          <span class="scale-dot" style="left: 60%"></span>
          <span class="scale-dot" style="left: 65%"></span>
          <span class="scale-dot" style="left: 70%"></span>
          <span class="scale-dot major" style="left: 75%"></span>
          <span class="scale-dot" style="left: 80%"></span>
          <span class="scale-dot" style="left: 85%"></span>
          <span class="scale-dot" style="left: 90%"></span>
          <span class="scale-dot" style="left: 95%"></span>
          <span class="scale-dot major" style="left: 100%"></span>
          <div id="pitchMarker" class="pitch-marker"></div>
        </div>
        <div class="scale-labels">
          <span style="left: 0%">-50</span>
          <span style="left: 25%">-25</span>
          <span style="left: 75%">25</span>
          <span style="left: 100%">50</span>
        </div>
      </div>
    </section>

    <!-- Кнопка настроек -->
    <button id="openSettingsBtn" class="glass-btn" type="button" aria-label="Настройки">
      <svg viewBox="0 0 24 24" class="sliders-icon" aria-hidden="true">
        <line x1="3.5" y1="8" x2="20.5" y2="8" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
        <circle cx="9" cy="8" r="2.8" fill="currentColor"/>
        <line x1="3.5" y1="16" x2="20.5" y2="16" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
        <circle cx="15" cy="16" r="2.8" fill="currentColor"/>
      </svg>
    </button>
  </main>

  <!-- Меню: Liquid Glass + Material Design -->
  <div id="glassModal" class="glass-modal" aria-hidden="true">
    <div id="glassBackdrop" class="glass-backdrop"></div>

    <div class="glass-layout">
      <div class="glass-topbar">
        <button id="closeSettingsBtn" class="glass-circle close-glass-btn" type="button" aria-label="Закрыть">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
            <path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
          </svg>
        </button>
      </div>

      <aside class="liquid-glass-panel">
        <div class="glass-scroll">
          <div class="glass-section">
            <div class="glass-section-title">Частота A₄</div>
            <div class="material-card">
              <div class="freq-stepper">
                <button id="a4Minus" class="m-icon-btn" type="button">−</button>
                <span id="a4Value" class="freq-value">442.0 Hz</span>
                <button id="a4Plus" class="m-icon-btn" type="button">+</button>
              </div>
              <div class="freq-presets">
                <button class="m-chip" data-a4="415" type="button">415</button>
                <button class="m-chip" data-a4="440" type="button">440</button>
                <button class="m-chip" data-a4="442" type="button">442</button>
                <button class="m-chip" data-a4="443" type="button">443</button>
              </div>
            </div>
          </div>

          <div class="glass-section">
            <div class="glass-section-title">Допуск зелёного экрана</div>
            <div class="m-segmented">
              <button class="m-seg" data-tol="4" type="button">Сцена</button>
              <button class="m-seg" data-tol="2" type="button">Оркестр</button>
              <button class="m-seg" data-tol="1" type="button">Студия</button>
            </div>
          </div>

          <div class="glass-section">
            <div class="glass-section-title">Знаки альтерации</div>
            <div class="m-segmented">
              <button class="m-seg" data-acc="auto" type="button">Авто</button>
              <button class="m-seg" data-acc="flat" type="button">Бемоли ♭</button>
              <button class="m-seg" data-acc="sharp" type="button">Диезы ♯</button>
            </div>
          </div>

          <div id="instrumentGroups"></div>
        </div>
      </aside>
    </div>
  </div>

  <script type="module" src="./app.js"></script>
</body>
</html>
